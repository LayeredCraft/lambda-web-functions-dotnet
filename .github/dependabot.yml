version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
