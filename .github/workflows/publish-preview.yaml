name: Publish Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      pull-requests: write
    uses: LayeredCraft/devops-templates/.github/workflows/publish-preview.yml@v11.2
    with:
      solution: LayeredCraft.LambdaWebFunctions.Hosting.slnx
      dotnetVersion: 11.0.x
      prereleaseIdentifier: preview
      hasTests: true
      buildConfiguration: Release

  push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: LayeredCraft/devops-templates/.github/actions/nuget-push@v11.2
        with:
          nuget_user: ${{ secrets.NUGET_USER }}
